name: Build signed Android release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The setup action's legacy 'tools' package is no longer available.
          packages: 'platform-tools'
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub secret: $variable"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/likefolder-release.p12"
          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/likefolder-release.p12" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify signature and release version
        run: |
          version_name=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APK version $version_name"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p build/release
          cp app/build/outputs/apk/release/app-release.apk build/release/LikeFolder.apk
          cd build/release
          sha256sum LikeFolder.apk > LikeFolder.apk.sha256
      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: LikeFolder-release-${{ github.ref_name }}
          path: |
            build/release/LikeFolder.apk
            build/release/LikeFolder.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Prepare draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$is_draft" != 'true' ]]; then
              echo '::error::This release is already published; its assets will not be replaced.'
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "LikeFolder $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" build/release/LikeFolder.apk build/release/LikeFolder.apk.sha256 --clobber
      - name: Upload release test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LikeFolder-release-tests-${{ github.ref_name }}
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/test-results/testReleaseUnitTest/
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/likefolder-release.p12"
